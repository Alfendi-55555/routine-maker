name: 공휴일 갱신

on:
  schedule:
    - cron: "10 0 1 * *" # 매달 1일 00:10 UTC (KST 09:10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 공휴일 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-holidays.js

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holidays.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 공휴일 $(date -u +%Y-%m-%d)"
            git push
          fi
